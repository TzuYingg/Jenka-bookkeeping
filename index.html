<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jenka・每日記帳</title>
<style>
  :root{
    --accent:#BF5B3D;
    --teal:#0F9088;
    --ochre:#C99A1E;
    --ink:#2B2824;
    --sub:#6b665e;
    --muted:#9a9488;
    --bg:#F6F3ED;
    --card:#FCFAF6;
    --line:#E7E2D8;
    --soft:#F6F3ED;
    --good:#0F9088;
    --goodBg:#E9F3F1;
    --highlightBg:#F3E8DE;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);}
  /* 版面寬度鎖定在手機直式的寬度，即使在平板上也不會被拉寬，視覺集中在畫面中間 */
  .app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh;background:var(--bg);position:relative;}
  .stickytop{position:sticky;top:0;z-index:6;background:var(--bg);}
  /* 上方：logo去背置中，狀態文字收到右上角小字，不放大標題文字 */
  header{position:relative;padding:14px 20px 2px;display:flex;flex-direction:column;align-items:center;}
  header .statuscorner{position:absolute;top:14px;right:20px;display:flex;align-items:center;gap:5px;}
  header .statuscorner .dot{width:6px;height:6px;border-radius:50%;background:var(--good);flex-shrink:0;}
  header .logo{height:38px;width:auto;display:block;}
  /* 日期：置中大字＋圓形箭頭 */
  .datebar{padding:6px 20px 10px;display:flex;align-items:center;justify-content:center;gap:16px;}
  .datebar button{border:none;background:var(--card);width:32px;height:32px;border-radius:50%;font-size:15px;font-weight:700;color:var(--sub);cursor:pointer;box-shadow:0 1px 3px rgba(43,40,36,.08);flex-shrink:0;}
  .datebar .datetext{text-align:center;}
  .datebar .big{font-size:20px;font-weight:800;color:var(--ink);}
  .datebar .small{font-size:11.5px;color:var(--muted);font-weight:600;}
  .topdivider{height:1px;background:var(--line);margin:0 20px;}
  .badge{font-size:11.5px;font-weight:700;background:var(--goodBg);color:var(--good);padding:6px 12px;border-radius:999px;}
  .badge.warn{background:#FBECE8;color:#B3452C;}
  .badge.neutral{background:#F3E8DE;color:var(--accent);}
  .statuscorner .txt{font-size:10.5px;color:var(--muted);font-weight:600;}
  .statuscorner.warn .dot{background:#B3452C;}
  .statuscorner.warn .txt{color:#B3452C;}
  .statuscorner.neutral .dot{background:var(--accent);}
  .statuscorner.neutral .txt{color:var(--accent);}
  /* 底部導覽：icon在上、字在下，取代原本上方分頁；點了會捲到該區塊，整頁仍可直接滑 */
  .stickybottom{position:sticky;bottom:0;z-index:6;}
  .bottomnav{display:flex;padding:8px 12px 12px;background:var(--card);border-top:1px solid var(--line);}
  .navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:4px;}
  .navitem svg{stroke:#B9B2A3;transition:stroke .15s;}
  .navitem span{font-size:10.5px;font-weight:600;color:#B9B2A3;transition:color .15s;}
  .navitem.active svg{stroke:var(--nav-color,var(--accent));}
  .navitem.active span{color:var(--nav-color,var(--accent));font-weight:700;}
  main{flex-grow:1;display:flex;flex-direction:column;gap:26px;padding:14px 20px 30px;}
  .col{display:flex;flex-direction:column;gap:12px;scroll-margin-top:14px;}
  .col h2{font-size:15px;font-weight:700;margin:0;display:flex;align-items:center;gap:10px;}
  .col h2 .secnum{width:26px;height:26px;border-radius:50%;color:var(--card);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .secnum.c-purchase{background:var(--ochre);}
  .secnum.c-revenue{background:var(--teal);}
  .secnum.c-cashbox{background:var(--accent);}
  .card{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:9px;box-shadow:0 2px 10px rgba(43,40,36,.06);}
  .card.b{position:relative;padding-left:20px;}
  .card.b::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:4px;background:var(--ochre);}
  .badgeicon{width:22px;height:22px;border-radius:50%;background:var(--ochre);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tag{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);}
  .row-between{display:flex;align-items:center;justify-content:space-between;}
  .slotname{font-size:14px;font-weight:800;}
  .scanbtn{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:800;color:var(--sub);background:var(--soft);border:1px solid var(--line);padding:4px 8px;border-radius:999px;}
  .metrics{display:flex;flex-direction:column;gap:10px;}
  .metric{background:var(--soft);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
  .metric .lbl{font-size:13px;color:var(--sub);font-weight:600;}
  .metric .vals{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums;}
  .metric .unit{font-size:15px;font-weight:600;color:var(--sub);}
  .metric .amt{font-size:20px;font-weight:800;color:var(--ink);}
  .metric.implied{background:var(--highlightBg);}
  .metric.implied .lbl{color:var(--accent);font-weight:700;}
  .metric.implied .sub2{font-size:10.5px;color:var(--accent);opacity:.8;font-weight:600;margin-top:2px;}
  .metric.implied .unit{color:var(--accent);opacity:.75;font-size:17px;}
  .metric.implied .amt{color:var(--accent);font-size:24px;}
  .hint{font-size:10.5px;color:var(--muted);}
  .sandwich-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .sandwich-grid .box{background:var(--soft);border-radius:10px;padding:10px 12px;cursor:pointer;}
  .sandwich-grid .box .lbl{font-size:10.5px;color:var(--muted);font-weight:700;}
  .sandwich-grid .box .val{font-size:16px;font-weight:800;color:var(--ink);margin-top:2px;}
  .cattabs{display:flex;gap:6px;background:var(--soft);border-radius:999px;padding:4px;margin-bottom:2px;}
  .cattab{flex:1;text-align:center;padding:9px 6px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);border:none;background:transparent;cursor:pointer;}
  .cattab.active{background:var(--ochre);color:var(--card);font-weight:700;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{border:none;background:var(--soft);color:var(--sub);border-radius:999px;font-weight:600;padding:9px 14px;font-size:12.5px;cursor:pointer;}
  .chip.dashed{border:1.5px dashed #D3CCBC;background:var(--card);color:var(--muted);}
  .plist{display:flex;flex-direction:column;gap:8px;}
  .pitem{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--soft);border-radius:10px;}
  .pitem .name{font-size:13px;font-weight:600;color:var(--ink);}
  .pitem .cat{font-size:10.5px;color:var(--muted);margin-top:1px;}
  .pitem .amt{font-size:14px;font-weight:700;margin-right:8px;}
  .pitem .del{border:none;background:none;color:var(--muted);font-size:16px;cursor:pointer;}
  .wizardbtn{width:100%;padding:11px;border-radius:999px;border:none;background:var(--accent);color:var(--card);font-weight:700;font-size:12.5px;cursor:pointer;margin-bottom:2px;}
  .cashtable{background:var(--soft);border-radius:12px;overflow:hidden;}
  .cashrow{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
  .cashrow:last-child{border-bottom:none;}
  .cashrow .d{font-size:13px;font-weight:600;color:var(--sub);}
  .cashrow .mid{display:flex;align-items:center;gap:14px;}
  .cashrow .qty{font-size:12.5px;color:var(--muted);min-width:34px;text-align:center;}
  .cashrow .sub{font-size:13px;font-weight:700;color:var(--ink);min-width:64px;text-align:right;}
  .divider{height:1px;background:var(--line);margin:2px 0;}
  .totalrow{display:flex;flex-direction:column;gap:3px;padding:14px;background:var(--goodBg);border-radius:12px;margin-top:2px;}
  .totalrow .toprow{display:flex;align-items:baseline;justify-content:space-between;}
  .totalrow .l{font-size:12.5px;font-weight:700;color:var(--good);}
  .totalrow .v{font-size:20px;font-weight:800;color:var(--good);font-variant-numeric:tabular-nums;}
  footer{background:var(--card);border-top:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .submitbtn{padding:14px 26px;border-radius:12px;border:none;font-size:14.5px;font-weight:700;background:var(--accent);color:var(--card);cursor:pointer;box-shadow:0 3px 8px rgba(191,91,61,.3);}
  .submitbtn:disabled{opacity:.5;cursor:default;box-shadow:none;}
  /* keypad sheet */
  .sheet-backdrop{position:fixed;inset:0;background:rgba(43,38,34,.35);display:none;align-items:flex-end;justify-content:center;z-index:20;}
  .sheet-backdrop.open{display:flex;}
  .sheet{background:var(--card);width:100%;max-width:420px;border-radius:18px 18px 0 0;padding:16px 18px 22px;box-shadow:0 -12px 30px rgba(0,0,0,.18);}
  .sheet .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .sheet .head .lbl{font-size:13px;color:var(--sub);font-weight:700;}
  .sheet .display{font-size:28px;font-weight:800;text-align:right;margin-bottom:12px;min-height:34px;}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .keys button{padding:16px 0;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-size:18px;font-weight:700;color:var(--ink);}
  .keys button.confirm{background:var(--accent);color:var(--card);border:none;font-size:15px;}
  .keys button.clear{background:var(--card);color:var(--sub);font-size:13px;}
  input,textarea{font-family:inherit;}
</style>
</head>

<script>
// ============ 設定：把 Apps Script 部署後的網址貼在這裡 ============
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycby8ATgPpZ7SJR3I6q1vKj13bZJ_yOk9ZMB0GUyqZSV3AZfXApVGiErsVZBAUuMcOvXk/exec"
};
// ===================================================================

// 現金不用自己算：填「總額」+ Line + Uber，現金是總額扣掉 Line、Uber 之後的餘數，
// 跟原本試算表的公式（H=N-J-L，I=O-K-M）邏輯一致，Code.gs 那邊會用公式寫回儲存格，
// 之後如果妳直接在 Google 試算表改總額，現金也會自動跟著重算。
const CHANNELS = [
  { key: "total", label: "總額" },
  { key: "line", label: "Line" },
  { key: "uber", label: "Uber" }
];
// 進貨分兩種分類，用分頁切換（不一次全部列出，避免太雜）；離線或還沒讀到『分類』分頁時先用這份預設清單
const FALLBACK_VENDORS = {
  "銷貨成本": ["晨起","蛋商","廣弘","毓品","肉商","蔬果","一豆","光泉","南北貨","非餅尋嚐","慶樺","好市多","外帶餐具","其他"],
  "固定成本": ["人事費","店租","水電瓦斯費","通訊費","廣告印刷費","修繕費","消耗品費","稅金","研究開發費","員工福利金","研修費","雜費"]
};
let vendorsByCategory = { "銷貨成本": FALLBACK_VENDORS["銷貨成本"].slice(), "固定成本": FALLBACK_VENDORS["固定成本"].slice() };
const CASHBOX_DENOMS = [1000,500,100,50,10,5,1];

function emptyDaily(){ return { totalUnits:0, totalAmount:0, lineUnits:0, lineAmount:0, uberUnits:0, uberAmount:0 }; }

function todayDay(){
  const now = new Date();
  return String(now.getDate());
}

let state = {
  day: todayDay(),
  daily: emptyDaily(),
  sandwich: { units:0, amount:0 },
  purchases: [],
  cashbox: Object.fromEntries(CASHBOX_DENOMS.map(d => [String(d), 0]))
};
let currentPurchaseCat = "銷貨成本"; // 目前選到哪個進貨分類分頁（不隨日期存檔，每次開啟預設銷貨成本）

const DRAFT_KEY = "jenka-bookkeeping-draft";
function saveDraft(){
  try { localStorage.setItem(DRAFT_KEY + "-" + state.day, JSON.stringify(state)); } catch(e){}
}
function loadDraft(day){
  try {
    const raw = localStorage.getItem(DRAFT_KEY + "-" + day);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return null;
}

function fmtMoney(n){ return "$" + Number(n||0).toLocaleString(); }

// ---------- 畫面：今日營業額卡片 ----------
function renderSlots(){
  const wrap = document.getElementById("slots");
  const s = state.daily;
  wrap.innerHTML = `
    <div class="card">
      <div class="row-between">
        <div class="slotname">今日總量（總額／Line／Uber）</div>
      </div>
      <div class="metrics">
        ${CHANNELS.map(c => `
          <div class="metric" data-channel="${c.key}">
            <div class="lbl">${c.label}</div>
            <div class="vals">
              <span class="unit" id="unit-${c.key}">${s[c.key+"Units"]||0}單</span>
              <span class="amt" id="amt-${c.key}">${fmtMoney(s[c.key+"Amount"])}</span>
            </div>
          </div>`).join("")}
      </div>
      <div class="hint">點欄位可直接輸入單量與金額（會先問單量、再問金額）。現金不用填，送出後系統會自動算：總額－Line－Uber。</div>
      <div class="metric implied">
        <div>
          <div class="lbl">推算現金</div>
          <div class="sub2">總額－Line－Uber</div>
        </div>
        <div class="vals">
          <span class="unit" id="impliedUnit">0單</span>
          <span class="amt" id="impliedAmt">$0</span>
        </div>
      </div>
    </div>
  `;
  wrap.querySelectorAll(".metric[data-channel]").forEach(el => {
    el.addEventListener("click", () => openChannelEntry(el.dataset.channel));
  });
  updateImpliedCash();
}

function updateImpliedCash(){
  const s = state.daily;
  const amtEl = document.getElementById("impliedAmt");
  const unitEl = document.getElementById("impliedUnit");
  if (!amtEl || !unitEl) return;
  const cashAmount = (s.totalAmount||0) - (s.lineAmount||0) - (s.uberAmount||0);
  const cashUnits = (s.totalUnits||0) - (s.lineUnits||0) - (s.uberUnits||0);
  amtEl.textContent = fmtMoney(cashAmount);
  unitEl.textContent = cashUnits + "單";
  const color = cashAmount < 0 ? "#B3452C" : "var(--accent)";
  amtEl.style.color = color;
  unitEl.style.color = color;
}

function openChannelEntry(ch){
  const chLabel = ({total:"總額",line:"Line",uber:"Uber"})[ch];
  openKeypad({
    label: "今日 " + chLabel + " 單量",
    initial: state.daily[ch+"Units"],
    onConfirm(units){
      state.daily[ch+"Units"] = units;
      openKeypad({
        label: "今日 " + chLabel + " 金額",
        initial: state.daily[ch+"Amount"],
        prefix: "$",
        onConfirm(amount){
          state.daily[ch+"Amount"] = amount;
          document.getElementById(`amt-${ch}`).textContent = fmtMoney(amount);
          document.getElementById(`unit-${ch}`).textContent = units + " 單";
          updateImpliedCash();
          saveDraft();
        }
      });
    }
  });
}

// ---------- 畫面：三明治 ----------
function renderSandwich(){
  document.getElementById("v-sandwich-units").textContent = state.sandwich.units ? state.sandwich.units + " 份" : "___ 份";
  document.getElementById("v-sandwich-amount").textContent = state.sandwich.amount ? fmtMoney(state.sandwich.amount) : "$ ___";
}
document.querySelectorAll("[data-field^='sandwich']").forEach(el => {
  el.addEventListener("click", () => {
    const field = el.dataset.field.split(".")[1]; // units | amount
    openKeypad({
      label: "現場三明治 · " + (field === "units" ? "份數" : "金額"),
      initial: state.sandwich[field],
      prefix: field === "amount" ? "$" : "",
      onConfirm(v){
        state.sandwich[field] = v;
        renderSandwich();
        saveDraft();
      }
    });
  });
});

// ---------- 畫面：進貨／支出項目（銷貨成本／固定成本 分頁切換） ----------
document.querySelectorAll("#purchaseTabs .cattab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#purchaseTabs .cattab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentPurchaseCat = btn.dataset.cat;
    renderVendorChips();
  });
});

function renderVendorChips(){
  const wrap = document.getElementById("vendorChips");
  wrap.innerHTML = "";
  const list = vendorsByCategory[currentPurchaseCat] || [];
  list.forEach(v => {
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.textContent = v;
    chip.addEventListener("click", () => openPurchaseEntry(v, currentPurchaseCat));
    wrap.appendChild(chip);
  });
  const other = document.createElement("div");
  other.className = "chip dashed";
  other.textContent = "+ 自行輸入項目";
  other.addEventListener("click", () => {
    const name = prompt("請輸入項目名稱：");
    if (name && name.trim()) openPurchaseEntry(name.trim(), currentPurchaseCat);
  });
  wrap.appendChild(other);
}

function openPurchaseEntry(vendor, category){
  openKeypad({
    label: vendor + " · 金額",
    initial: 0,
    prefix: "$",
    onConfirm(amount){
      if (amount <= 0) return;
      const note = (prompt("備註（可留空，直接確定即可）：", "") || "").trim();
      state.purchases.push({ vendor, category, detail:"", note, amount });
      renderPurchaseList();
      saveDraft();
    }
  });
}

function renderPurchaseList(){
  const wrap = document.getElementById("purchaseList");
  wrap.innerHTML = "";
  state.purchases.forEach((p, idx) => {
    const cat = p.category || "銷貨成本";
    const row = document.createElement("div");
    row.className = "pitem";
    row.innerHTML = `
      <div>
        <div class="name">${p.vendor}${p.detail ? " · " + p.detail : ""}</div>
        <div class="cat">${cat}${p.note ? " · " + p.note : ""}</div>
      </div>
      <div style="display:flex;align-items:center;">
        <div class="amt">${fmtMoney(p.amount)}</div>
        <button class="del">✕</button>
      </div>
    `;
    row.querySelector(".del").addEventListener("click", () => {
      state.purchases.splice(idx, 1);
      renderPurchaseList();
      saveDraft();
    });
    wrap.appendChild(row);
  });
  if (state.purchases.length >= 9) {
    const warn = document.createElement("div");
    warn.className = "hint";
    warn.style.color = "#B3452C";
    warn.textContent = "已達今日進貨/支出上限（9筆），如需更多請合併同項目。";
    wrap.appendChild(warn);
  }
}

// ---------- 畫面：錢盒現金 ----------
function renderCashbox(){
  const wrap = document.getElementById("cashboxCard");
  wrap.innerHTML = "";

  const startBtn = document.createElement("button");
  startBtn.className = "wizardbtn";
  startBtn.textContent = "🔢 開始清點（依序輸入全部面額）";
  startBtn.addEventListener("click", startCashboxWizard);
  wrap.appendChild(startBtn);

  const table = document.createElement("div");
  table.className = "cashtable";
  CASHBOX_DENOMS.forEach(d => {
    const qty = state.cashbox[String(d)] || 0;
    const row = document.createElement("div");
    row.className = "cashrow";
    row.dataset.denom = d;
    row.innerHTML = `
      <div class="d">$${d.toLocaleString()}</div>
      <div class="mid">
        <div class="qty" id="qty-${d}">× ${qty}</div>
        <div class="sub" id="sub-${d}">${fmtMoney(qty*d)}</div>
      </div>
    `;
    // 點單一列：只改這個面額，改完就關閉（適合修正單一筆）
    row.addEventListener("click", () => openCashboxStep(CASHBOX_DENOMS.indexOf(d), false));
    table.appendChild(row);
  });
  wrap.appendChild(table);
  const total = document.createElement("div");
  total.className = "totalrow";
  total.innerHTML = `<div class="toprow"><div class="l">錢盒總額</div><div class="v" id="cashboxTotal">$0</div></div>`;
  wrap.appendChild(total);
  updateCashboxTotal();
}
function updateCashboxTotal(){
  let sum = 0;
  CASHBOX_DENOMS.forEach(d => sum += (state.cashbox[String(d)]||0) * d);
  const el = document.getElementById("cashboxTotal");
  if (el) el.textContent = fmtMoney(sum);
}

// ---------- 錢盒快速清點：確認一個面額後自動跳下一個，不用每次重新點選 ----------
function startCashboxWizard(){
  openCashboxStep(0, true);
}
function openCashboxStep(index, chained){
  if (index < 0 || index >= CASHBOX_DENOMS.length) return;
  const d = CASHBOX_DENOMS[index];
  openKeypad({
    label: "$" + d.toLocaleString() + " 面額 · 張數" + (chained ? "（" + (index+1) + "/" + CASHBOX_DENOMS.length + "）" : ""),
    initial: state.cashbox[String(d)],
    onConfirm(v){
      state.cashbox[String(d)] = v;
      document.getElementById(`qty-${d}`).textContent = "× " + v;
      document.getElementById(`sub-${d}`).textContent = fmtMoney(v*d);
      updateCashboxTotal();
      saveDraft();
      if (chained && index + 1 < CASHBOX_DENOMS.length) {
        openCashboxStep(index + 1, true); // 自動接著跳下一個面額，不用再點一次
      }
    }
  });
}

// ---------- 共用數字鍵盤 ----------
let keypadCtx = null;
function openKeypad({label, initial, prefix, suffix, onConfirm}){
  keypadCtx = { value: String(initial || ""), onConfirm, prefix: prefix||"", suffix: suffix||"" };
  document.getElementById("sheetLabel").textContent = label;
  updateKeypadDisplay();
  document.getElementById("sheetBackdrop").classList.add("open");
}
function updateKeypadDisplay(){
  const v = keypadCtx.value === "" ? "0" : keypadCtx.value;
  document.getElementById("sheetDisplay").textContent = keypadCtx.prefix + Number(v).toLocaleString() + keypadCtx.suffix;
}
function closeKeypad(){
  document.getElementById("sheetBackdrop").classList.remove("open");
  keypadCtx = null;
}
document.getElementById("sheetClose").addEventListener("click", closeKeypad);
document.getElementById("sheetBackdrop").addEventListener("click", (e) => {
  if (e.target.id === "sheetBackdrop") closeKeypad();
});
document.querySelectorAll(".keys button").forEach(btn => {
  btn.addEventListener("click", () => {
    if (!keypadCtx) return;
    const k = btn.dataset.k;
    if (k === "clear") { keypadCtx.value = ""; updateKeypadDisplay(); return; }
    if (k === "confirm") {
      const val = Number(keypadCtx.value || 0);
      const cb = keypadCtx.onConfirm;
      closeKeypad();
      cb(val);
      return;
    }
    if (keypadCtx.value.length >= 7) return; // 避免誤觸過長數字
    keypadCtx.value = (keypadCtx.value === "0" ? "" : keypadCtx.value) + k;
    updateKeypadDisplay();
  });
});

// ---------- 送出 ----------
document.getElementById("submitBtn").addEventListener("click", submitEntry);
async function submitEntry(){
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "送出中…";
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // 避免瀏覽器預檢請求，Apps Script 不支援 OPTIONS
      body: JSON.stringify(state)
    });
    const data = await res.json();
    if (!data.ok) {
      alert("送出失敗：" + data.error);
      btn.disabled = false;
      btn.textContent = "送出今日帳目";
      return;
    }
    const badge = document.getElementById("statusBadge");
    badge.querySelector(".txt").textContent = "已送出";
    badge.className = "statuscorner";
    const reconcile = document.getElementById("reconcileBadge");
    reconcile.textContent = data.message;
    reconcile.className = "badge " + (data.diff === 0 ? "" : (data.diff > 0 ? "" : "warn"));
    document.getElementById("footerHint").textContent =
      "現金應有 " + fmtMoney(data.cashAmount) + "，錢盒總額 " + fmtMoney(data.cashboxTotal);
    btn.textContent = "已送出";
    // 送出後按鈕保持可以再按：填寫還沒完成也可以先送一次，之後補填其他部分再送出一次會用最新內容覆蓋更新
    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = "送出今日帳目";
    }, 1500);
  } catch (err) {
    alert("連線失敗，請檢查網路，或稍後再試一次。\n" + err);
    btn.disabled = false;
    btn.textContent = "送出今日帳目";
  }
}

// ---------- 底部導覽：點了會平滑捲動過去，整頁依然可以直接往下滑完全部（兩種操作混合） ----------
document.querySelectorAll(".navitem").forEach(btn => {
  btn.addEventListener("click", () => {
    const target = document.getElementById(btn.dataset.target);
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
  });
});
function setActiveTab(id){
  document.querySelectorAll(".navitem").forEach(b => b.classList.toggle("active", b.dataset.target === id));
}
const sectionObserver = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) setActiveTab(e.target.id); });
}, { rootMargin: "-20% 0px -65% 0px", threshold: 0 });
["sec-purchase","sec-revenue","sec-cashbox"].forEach(id => {
  const el = document.getElementById(id);
  if (el) sectionObserver.observe(el);
});

// ---------- 換日期 ----------
function refreshDateLabel(){
  const d = new Date();
  d.setDate(Number(state.day));
  const weekday = ["日","一","二","三","四","五","六"][d.getDay()];
  document.getElementById("dateLabel").textContent = (d.getMonth()+1) + "月" + state.day + "日";
  document.getElementById("dateWeekday").textContent = "週" + weekday;
}
document.getElementById("prevDay").addEventListener("click", () => switchDay(Number(state.day) - 1));
document.getElementById("nextDay").addEventListener("click", () => switchDay(Number(state.day) + 1));
function switchDay(newDay){
  if (newDay < 1 || newDay > 31) return;
  saveDraft();
  state.day = String(newDay);
  const draft = loadDraft(state.day);
  state = draft || {
    day: String(newDay),
    daily: emptyDaily(),
    sandwich: { units:0, amount:0 },
    purchases: [],
    cashbox: Object.fromEntries(CASHBOX_DENOMS.map(d => [String(d), 0]))
  };
  renderAll();
}

function renderAll(){
  refreshDateLabel();
  renderSlots();
  renderSandwich();
  renderVendorChips();
  renderPurchaseList();
  renderCashbox();
}

// ---------- 初始化 ----------
async function init(){
  const draft = loadDraft(state.day);
  if (draft) state = draft;
  renderAll(); // 先用內建清單畫面，網路狀況不好也能馬上操作

  try {
    const res = await fetch(CONFIG.API_URL + "?action=vendors");
    const data = await res.json();
    if (data.ok && data.vendors) {
      if (data.vendors["銷貨成本"] && data.vendors["銷貨成本"].length) vendorsByCategory["銷貨成本"] = data.vendors["銷貨成本"];
      if (data.vendors["固定成本"] && data.vendors["固定成本"].length) vendorsByCategory["固定成本"] = data.vendors["固定成本"];
      renderVendorChips();
    }
  } catch(e) {
    // 離線或還沒設定好網址時，用內建的清單，不影響操作
  }
}
init();
</script>
